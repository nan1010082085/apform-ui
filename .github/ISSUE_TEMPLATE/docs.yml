name: 文档问题
description: Demo / API 表 / 指南页错误或缺失
title: "[Docs] "
labels: ["documentation"]
body:
  - type: input
    id: page
    attributes:
      label: 页面路径或组件名
      placeholder: /components/CardTable 或 docs/guide/faq.md
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: 问题描述
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 建议改法（可选）
    validations:
      required: false
