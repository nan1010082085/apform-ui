name: 组件需求
description: 新组件或现有组件能力增强
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 场景与用户故事
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议 API / 交互
    validations:
      required: false
  - type: dropdown
    id: entry
    attributes:
      label: 期望入口
      options:
        - core
        - chat
        - bpmn
        - 不确定
    validations:
      required: true
