name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'packages/core/**'
      - 'playground/**'
      - 'scripts/deploy-to-pyflow.sh'
      - 'scripts/verify-live-docs.mjs'
      - 'scripts/publish-with-docs.sh'
      - 'scripts/postpublish-docs.mjs'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - uses: actions/setup-node@v4
        with:
          # pnpm@11 要求 Node >= 22.13
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check version sync
        run: pnpm check:version

      - name: Read version
        id: ver
        run: echo "version=$(node -p "require('./packages/core/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build core
        run: pnpm build:core

      - name: Build docs
        run: pnpm docs:build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: playground/dist

      - name: Upload pyflow rsync artifact
        uses: actions/upload-artifact@v4
        with:
          name: apform-docs-dist
          path: playground/dist

  deploy-github-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # pyflow 主文档站。需 Secrets：APFORM_DOCS_SSH_KEY（必填才跑）；APFORM_DOCS_SERVER 可选
  deploy-pyflow:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ secrets.APFORM_DOCS_SSH_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apform-docs-dist
          path: playground/dist

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.APFORM_DOCS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H pyflow.icu >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Rsync to pyflow
        env:
          SERVER: ${{ secrets.APFORM_DOCS_SERVER }}
        run: |
          SERVER="${SERVER:-ubuntu@pyflow.icu}"
          REMOTE_DIR="/home/ubuntu/schema-platform/apps/apform-ui"
          ssh -o StrictHostKeyChecking=accept-new "$SERVER" "mkdir -p $REMOTE_DIR"
          rsync -az --delete playground/dist/ "$SERVER:$REMOTE_DIR/"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify live docs
        run: node scripts/verify-live-docs.mjs --expect "${{ needs.build.outputs.version }}"
